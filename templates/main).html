{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Услуги</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body style="background-image: url('{% static 'images/bg.jpg' %}');">
    <div class="container">
        <h1>Географические объекты марса</h1>
        <div class="cards">
            {% for service in services %}
            <div class="card">
                <img src="{% static service.image %}" alt="{{ service.name }}">
                <h2>{{ service.name }}</h2>
                <div class="buttons">
                    <button class="details">Подробнее</button>
                    <button class="cart-btn">
                        <img src="{% static 'images/cart.png' %}" alt="Корзина">
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
