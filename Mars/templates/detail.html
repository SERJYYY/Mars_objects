{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ obj.name }}</title>
    <link rel="stylesheet" href="{% static 'css/styles_detail.css' %}">
</head>
<body class="background">
    <div class="detail-container">
        <h1 class="detail-title">{{ obj.name }}</h1>
        
        {% if obj.image_url %}
            <img src="{{ obj.image_url }}" alt="{{ obj.name }}" class="detail-image">
        {% else %}
            <p>Изображение не доступно</p>
        {% endif %}
        
        <p class="detail-description">{{ obj.description }}</p>

        <!-- Кнопка на главную страницу -->
        <a href="{% url 'home' %}" class="btn home-btn">На главную</a>
    </div>
</body>
</html>
